  (() =&gt; {
    const root = document.getElementById(&quot;competitive-landscape-investor&quot;);
    const rows = [{&quot;id&quot;:&quot;mckinsey_core&quot;,&quot;name&quot;:&quot;McKinsey core strategy practice&quot;,&quot;parent&quot;:&quot;McKinsey &amp; Company&quot;,&quot;scope&quot;:&quot;Growth / strategy / M&amp;A advisory delivered by McKinsey consultants under core Strategy &amp; Corporate Finance / Growth, Marketing &amp; Sales practices&quot;,&quot;type&quot;:&quot;direct&quot;,&quot;confidence&quot;:&quot;verified&quot;,&quot;cells&quot;:{&quot;who_does_the_thinking&quot;:{&quot;research&quot;:&quot;human_expert&quot;,&quot;secondary&quot;:&quot;human_expert&quot;,&quot;status&quot;:&quot;explicit&quot;,&quot;note&quot;:null,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/how-we-help-clients/strategy&quot;,&quot;title&quot;:&quot;Strategy&quot;,&quot;publisher&quot;:&quot;McKinsey &amp; Company&quot;},{&quot;url&quot;:&quot;https://www.mckinsey.com/jp/our-work/strategy-and-corporate-finance&quot;,&quot;title&quot;:&quot;Strategy &amp; Corporate Finance | Japan&quot;,&quot;publisher&quot;:&quot;McKinsey &amp; Company&quot;,&quot;lang&quot;:&quot;ja&quot;}],&quot;prose&quot;:&quot;McKinsey core strategy practice relies entirely on human consultants (partners, engagement managers, and associates) to synthesize data, apply frameworks, and generate recommendations. Software is utilized solely as a supportive input for quantitative modeling or data staging, not as a decision-making agent.&quot;},&quot;auditable_provenance&quot;:{&quot;research&quot;:&quot;asserted&quot;,&quot;secondary&quot;:&quot;asserted&quot;,&quot;status&quot;:&quot;assumed&quot;,&quot;note&quot;:&quot;Official pages describe advisory work and empirical tools but do not describe claim-level citations in client outputs.&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/how-we-help-clients/strategy&quot;,&quot;title&quot;:&quot;Strategy&quot;,&quot;publisher&quot;:&quot;McKinsey &amp; Company&quot;},{&quot;url&quot;:&quot;https://www.mckinsey.com/jp/our-work/strategy-and-corporate-finance&quot;,&quot;title&quot;:&quot;Strategy &amp; Corporate Finance | Japan&quot;,&quot;publisher&quot;:&quot;McKinsey &amp; Company&quot;,&quot;lang&quot;:&quot;ja&quot;}],&quot;prose&quot;:&quot;Deliverables are typically highly synthesized, polished PowerPoint presentations (&#x27;decks&#x27;). Key findings and recommendations are asserted on the authority of McKinsey&#x27;s expertise, client interviews, and peer reviews. Granular, claim-level tracing back to raw source files is absent in standard final deliverables.&quot;},&quot;commercial_model&quot;:{&quot;research&quot;:{&quot;unit&quot;:&quot;engagement&quot;,&quot;band&quot;:&quot;not found&quot;},&quot;secondary&quot;:{&quot;unit&quot;:&quot;engagement&quot;,&quot;band&quot;:&quot;500k+&quot;},&quot;status&quot;:&quot;partly_assumed&quot;,&quot;note&quot;:&quot;Engagement sale is clear; no public official fee band found on checked McKinsey strategy pages/contact flow.&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/how-we-help-clients/strategy&quot;,&quot;title&quot;:&quot;Strategy&quot;,&quot;publisher&quot;:&quot;McKinsey &amp; Company&quot;},{&quot;url&quot;:&quot;https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/contact-us&quot;,&quot;title&quot;:&quot;Contact Us | Strategy &amp; Corporate Finance&quot;,&quot;publisher&quot;:&quot;McKinsey &amp; Company&quot;}],&quot;prose&quot;:&quot;Engagements are transaction-based, priced per bespoke strategy study. A standard 6-to-14-week corporate strategy or growth opportunity study for an enterprise client is highly premium, typically costing between $800,000 and $1.5 million, putting it firmly in the $500K+ band.&quot;},&quot;grounded_in&quot;:{&quot;research&quot;:&quot;both&quot;,&quot;secondary&quot;:&quot;both&quot;,&quot;status&quot;:&quot;explicit&quot;,&quot;note&quot;:null,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/how-we-help-clients/strategy&quot;,&quot;title&quot;:&quot;Strategy&quot;,&quot;publisher&quot;:&quot;McKinsey &amp; Company&quot;},{&quot;url&quot;:&quot;https://www.mckinsey.com/jp/our-work/strategy-and-corporate-finance&quot;,&quot;title&quot;:&quot;Strategy &amp; Corporate Finance | Japan&quot;,&quot;publisher&quot;:&quot;McKinsey &amp; Company&quot;,&quot;lang&quot;:&quot;ja&quot;}],&quot;prose&quot;:&quot;Analysis is heavily grounded in the client&#x27;s internal proprietary operational data (VDRs, historical financials, expert interviews) combined with McKinsey&#x27;s licensed external databases, industry benchmarks, and proprietary global market intelligence.&quot;},&quot;time_to_first_usable_output&quot;:{&quot;research&quot;:&quot;weeks&quot;,&quot;secondary&quot;:&quot;weeks&quot;,&quot;status&quot;:&quot;assumed&quot;,&quot;note&quot;:&quot;Official pages describe bespoke strategy engagements rather than instant product outputs.&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/how-we-help-clients/strategy&quot;,&quot;title&quot;:&quot;Strategy&quot;,&quot;publisher&quot;:&quot;McKinsey &amp; Company&quot;},{&quot;url&quot;:&quot;https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/contact-us&quot;,&quot;title&quot;:&quot;Contact Us | Strategy &amp; Corporate Finance&quot;,&quot;publisher&quot;:&quot;McKinsey &amp; Company&quot;}],&quot;prose&quot;:&quot;A typical core strategy study spans 6 to 14 weeks. Initial usable outputs (such as interim diagnostic findings or market-sizing assessments) are delivered at the first major steerco milestone, typically within 3 to 4 weeks from kickoff.&quot;},&quot;procurement_path&quot;:{&quot;research&quot;:&quot;standard_procurement&quot;,&quot;secondary&quot;:&quot;full_enterprise_ e&quot;:null,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/how-we-help-clients/strategy&quot;,&quot;title&quot;:&quot;Strategy&quot;,&quot;publisher&quot;:&quot;McKinsey &amp; Company&quot;},{&quot;url&quot;:&quot;https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/contact-us&quot;,&quot;title&quot;:&quot;Contact Us | Strategy &amp; Corporate Finance&quot;,&quot;publisher&quot;:&quot;McKinsey &amp; Company&quot;}],&quot;prose&quot;:&quot;The traditional consulting business model scales flat-linearly. To evaluate a new growth initiative or adjacent market, the client must hire a new consulting team and pay another full engagement fee, with no software leverage.&quot;},&quot;growth_initiative_purpose_built&quot;:{&quot;research&quot;:&quot;adjacent_configurable&quot;,&quot;secondary&quot;:&quot;purpose_built&quot;,&quot;status&quot;:&quot;assumed&quot;,&quot;note&quot;:&quot;Purpose-built for strategy/growth advisory, but not a dedicated single-initiative software product.&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/how-we-help-clients/strategy&quot;,&quot;title&quot;:&quot;Strategy&quot;,&quot;publisher&quot;:&quot;McKinsey &amp; Company&quot;},{&quot;url&quot;:&quot;https://www.mckinsey.com/jp/our-work/strategy-and-corporate-finance&quot;,&quot;title&quot;:&quot;Strategy &amp; Corporate Finance | Japan&quot;,&quot;publisher&quot;:&quot;McKinsey &amp; Company&quot;,&quot;lang&quot;:&quot;ja&quot;}],&quot;prose&quot;:&quot;Every core strategy engagement is a bespoke study specifically designed, staffed, and tailored to evaluate the unique growth initiative, market-entry hypothesis, or corporate development objective of the client.&quot;},&quot;direction_of_travel&quot;:{&quot;research&quot;:&quot;static&quot;,&quot;secondary&quot;:&quot;static&quot;,&quot;status&quot;:&quot;assumed&quot;,&quot;note&quot;:null,&q ;,&quot;title&quot;:&quot;Catalant&quot;,&quot;publisher&quot;:&quot;Catalant&quot;},{&quot;url&quot;:&quot;https://www.toptal.com/services/management-consulting/ai-consulting&quot;,&quot;title&quot;:&quot;AI Consulting&quot;,&quot;publisher&quot;:&quot;Toptal&quot;}],&quot;prose&quot;:&quot;Accelerated by agentic research software, an independent consultant can deliver a high-quality, comprehensive strategic assessment within 2 to 4 weeks of kickoff.&quot;},&quot;procurement_path&quot;:{&quot;research&quot;:&quot;unspecified&quot;,&quot;secondary&quot;:&quot;below_po_threshold&quot;,&quot;status&quot;:&quot;unspecified&quot;,&quot;note&quot;:&quot;The cohort spans freelancers, expert networks, and boutique firms with materially different buying motions.&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;artifact://innovera_competitive_set_final.json&quot;,&quot;title&quot;:&quot;Uploaded competitors JSON&quot;,&quot;publisher&quot;:&quot;User-provided artifact&quot;,&quot;source_type&quot;:&quot;artifact&quot;},{&quot;url&quot;:&quot;https://catalant.com/&quot;,&quot;title&quot;:&quot;Catalant&quot;,&quot;publisher&quot;:&quot;Catalant&quot;},{&quot;url&quot;:&quot;https://www.toptal.com/services/management-consulting/ai-consulting&quot;,&quot;title&quot;:&quot;AI Consulting&quot;,&quot;publisher&quot;:&quot;Toptal&quot;},{&quot;url&quot;:&quot;https://investors.upwork.com/news-releases/news-release-details/upwork-launches-new-generative-ai-tools-and-services-hub&quot;,&quot;title&quot;:&quot;Upwork launches AI tools and services hub&quot;,&quot;publisher&quot;:&quot;Upwork&quot;}],&quot;prose&quot;:&quot;Because engagement fees typically fall under $50,000, projects can often be approved directly by division heads under standard PO limits, completely bypassing full procurement.&quot;},&quot;local_language_delivery&quot;:{&quot;research&quot;:&quot;unspecified&quot;,&quot;secondary&quot;:&quot;board_grade_single&quot;,&quot;status&quot;:&quot;unspecified&quot;,&quot;note&quot;:&quot;Public representative sources do not establish a stable multilingual delivery standard for the cohort.&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;artifact://innovera_competitive_set_final.json&quot;,&quot;title&quot;:&quot;Uploaded competitors JSON&quot;,&quot;publisher&quot;:&quot;User-provided artifact&quot;,&quot;source_type&quot;:&quot;artifact&quot;},{&quot;url&quot;:&quot;https://catalant.com/&quot;,&quot;title&quot;:&quot;Catalant&quot;,&quot;publisher&quot;:&quot;Catalant&quot;},{&quot;url&quot;:&quot;https://www.toptal.com/services/management-consulting/ai-consulting&quot;,&quot;title&quot;:&quot;AI Consulting&quot;,&quot;publisher&quot;:&quot;Toptal&quot;}],&quot;prose&quot;:&quot;Typically delivers exceptionally high-quality board-grade strategic materials in a single language (the consultant&#x27;s native language, e.g., English), lacking regional multilingual support.&quot;},&quot;marginal_cost_of_next_assessment&quot;:{&quot;research&quot;:&quot;flat_linear&quot;,&quot;secondary&quot;:&quot;flat_linear&quot;,&quot;status&quot;:&quot;assumed&quot;,&quot;note&quot;:null,&quot;sources&quot;:[{&quot;url&quot;:&quot;artifact://innovera_competitive_set_final.json&quot;,&quot;title&quot;:&quot;Uploaded competitors JSON&quot;,&quot;publisher&quot;:&quot;User-provided artifact&quot;,&quot;source_type&quot;:&quot;artifact&quot;},{&quot;url&quot;:&quot;https://catalant.com/&quot;,&quot;title&quot;:&quot;Catalant&quot;,&quot;publisher&quot;:&quot;Catalant&quot;},{&quot;url&quot;:&quot;https://www.toptal.com/services/management-consulting/ai-consulting&quot;,&quot;title&quot;:&quot;AI Consulting&quot;,&quot;publisher&quot;:&quot;Toptal&quot;}],&quot;prose&quot;:&quot;Each new strategy assessment requires dedicated manual hours of analysis and partner validation, scaling the consultant&#x27;s costs flat-linearly with each project.&quot;},&quot;growth_initiative_purpose_built&quot;:{&quot;research&quot;:&quot;adjacent_configurable&quot;,&quot;secondary&quot;:&quot;purpose_built&quot;,&quot;status&quot;:&quot;assumed&quot;,&quot;note&quot;:null,&quot;sources&quot;:[{&quot;url&quot;:&quot;artifact://innovera_competitive_set_final.json&quot;,&quot;title&quot;:&quot;Uploaded competitors JSON&quot;,&quot;publisher&quot;:&quot;User-provided artifact&quot;,&quot;source_type&quot;:&quot;artifact&quot;},{&quot;url&quot;:&quot;https://www.toptal.com/services/management-consulting/ai-consulting&quot;,&quot;title&quot;:&quot;AI Consulting&quot;,&quot;publisher&quot;:&quot;Toptal&quot;},{&quot;url&quot;:&quot;https://catalant.com/&quot;,&quot;title&quot;:&quot;Catalant&quot;,&quot;publisher&quot;:&quot;Catalant&quot;}],&quot;prose&quot;:&quot;Deliverables are highly customized, tailored, and purpose-built to address the corporate client&#x27;s specific business hypothesis or market entry strategy.&quot;},&quot;direction_of_travel&quot;:{&quot;research&quot;:&quot;moving_toward&quot;,&quot;secondary&quot;:&quot;moving_toward&quot;,&quot;status&quot;:&quot;explicit&quot;,&quot;note&quot;:null,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://catalant.com/&quot;,&quot;title&quot;:&quot;Catalant&quot;,&quot;publisher&quot;:&quot;Catalant&quot;},{&quot;url&quot;:&quot;https://investors.upwork.com/news-releases/news-release-details/upwork-launches-new-generative-ai-tools-and-services-hub&quot;,&quot;title&quot;:&quot;Upwork launches AI tools and services hub&quot;,&quot;publisher&quot;:&quot;Upwork&quot;}],&quot;prose&quot;:&quot;Highly dynamic segment. Independent consultants are rapidly adopting custom agent-building platforms to underprice and outpace traditional mid-tier consulting firms in 2026.&quot;}}}];

    const dimensions = [
      [&quot;who_does_the_thinking&quot;, &quot;Who thinks&quot;, &quot;Human, software, or hybrid&quot;],
      [&quot;auditable_provenance&quot;, &quot;Provenance&quot;, &quot;Traceability of the answer&quot;],
      [&quot;commercial_model&quot;, &quot;Commercial model&quot;, &quot;Unit and price band&quot;],
      [&quot;grounded_in&quot;, &quot;Grounding&quot;, &quot;Client and external inputs&quot;],
      [&quot;time_to_first_usable_output&quot;, &quot;First output&quot;, &quot;Time to usable work&quot;],
      [&quot;procurement_path&quot;, &quot;Procurement&quot;, &quot;Path to purchase&quot;],
      [&quot;local_language_delivery&quot;, &quot;Local delivery&quot;, &quot;Board-grade APAC reach&quot;],
      [&quot;marginal_cost_of_next_assessment&quot;, &quot;Next assessment&quot;, &quot;Marginal economics&quot;],
      [&quot;growth_initiative_purpose_built&quot;, &quot;Initiative fit&quot;, &quot;Purpose-built or adjacent&quot;],
      [&quot;direction_of_travel&quot;, &quot;Trajectory&quot;, &quot;Where the product is moving&quot;]
    ];

    const labels = {
      human_expert: &quot;Human expert&quot;,
      software_only: &quot;Software only&quot;,
      hybrid_human_validated: &quot;Hybrid + human validated&quot;,
      buyer_themselves: &quot;Buyer team&quot;,
      claim_level_traceable: &quot;Claim-level traceable&quot;,
      source_cited: &quot;Source cited&quot;,
      asserted: &quot;Asserted&quot;,
      none: &quot;None&quot;,
      initiative: &quot;Initiative&quot;,
      engagement: &quot;Engagement&quot;,
      seat: &quot;Seat&quot;,
      subscription: &quot;Subscription&quot;,
      retainer: &quot;Retainer&quot;,
      equity_venture: &quot;Equity / venture&quot;,
      both: &quot;Client + external&quot;,
      client_corpus: &quot;Client corpus&quot;,
      licensed_external: &quot;Licensed external&quot;,
      ad_hoc_input: &quot;Ad hoc input&quot;,
      internal_only: &quot;Internal only&quot;,
      minutes_hours: &quot;Minutes–hours&quot;,
      days: &quot;Days&quot;,
      weeks: &quot;Weeks&quot;,
      months: &quot;Months&quot;,
      year_plus: &quot;Year+&quot;,
      existing_subscription: &quot;Existing subscription&quot;,
      below_po_threshold: &quot;Below PO threshold&quot;,
      standard_procurement: &quot;Standard procurement&quot;,
      full_enterprise_procurement: &quot;Full enterprise procurement&quot;,
      no_purchase: &quot;No purchase&quot;,
      board_grade_multi_apac: &quot;Board-grade, multi-APAC&quot;,
      board_grade_single: &quot;Board-grade, single market&quot;,
      english_plus_translation: &quot;English + translation&quot;,
      english_only: &quot;English only&quot;,
      near_zero: &quot;Near zero&quot;,
      sublinear: &quot;Sublinear&quot;,
      flat_linear: &quot;Flat linear&quot;,
      increasing: &quot;Increasing&quot;,
      purpose_built: &quot;Purpose built&quot;,
      adjacent_configurable: &quot;Adjacent / configurable&quot;,
      general_purpose: &quot;General purpose&quot;,
      moving_toward: &quot;Moving toward&quot;,
      moving_away: &quot;Moving away&quot;,
      static: &quot;Static&quot;,
      consolidating: &quot;Consolidating&quot;,
      not_applicable: &quot;Not applicable&quot;,
      unspecified: &quot;Unspecified&quot;,
      direct: &quot;Direct&quot;,
      category: &quot;Category&quot;,
      same_problem_different_mechanism: &quot;Same problem, different mechanism&quot;,
      frontier_substitute: &quot;Frontier substitute&quot;,
      non_consumption: &quot;Non-consumption&quot;,
      verified: &quot;Verified&quot;,
      inferred: &quot;Inferred&quot;,
      explicit: &quot;Explicit&quot;,
      assumed: &quot;Assumed&quot;,
      partly_assumed: &quot;Partly assumed&quot;,
      unspecified_status: &quot;Unspecified&quot;
    };

    const priceLabels = {
      &quot;&lt;10k&quot;: &quot;&lt;$10K&quot;,
      &quot;10–100k&quot;: &quot;$10K–$100K&quot;,
      &quot;100–500k&quot;: &quot;$100K–$500K&quot;,
      &quot;500k+&quot;: &quot;$500K+&quot;,
      &quot;n/a&quot;: &quot;N/A&quot;,
      &quot;not found&quot;: &quot;Not found&quot;
    };

    const modeLabels = {
      aligned: &quot;Aligned&quot;,
      estimated: &quot;Estimated fallback&quot;,
      mixed: &quot;Mixed convergence&quot;,
      retained: &quot;Sourced decision&quot;
    };

    const same = (a, b) =&gt; JSON.stringify(a) === JSON.stringify(b);

    const resolve = (research, secondary) =&gt; {
      if (research &amp;&amp; typeof research === &quot;object&quot; &amp;&amp; !Array.isArray(research)) {
        const selected = { ...research };
        if (
          research.band === &quot;not found&quot; &amp;&amp;
          secondary &amp;&amp;
          secondary.band &amp;&amp;
          secondary.band !== &quot;not found&quot;
        ) {
          selected.band = secondary.band;
          return {
            selected,
            mode: research.unit === secondary.unit ? &quot;estimated&quot; : &quot;mixed&quot;
          };
        }
        return {
          selected,
          mode: same(research, secondary) ? &quot;aligned&quot; : &quot;retained&quot;
        };
      }

      if (
        research === &quot;unspecified&quot; &amp;&amp;
        secondary &amp;&amp;
        secondary !== &quot;unspecified&quot;
      ) {
        return { selected: secondary, mode: &quot;estimated&quot; };
      }

      return {
        selected: research,
        mode: same(research, secondary) ? &quot;aligned&quot; : &quot;retained&quot;
      };
    };

    const displayValue = (value) =&gt; {
      if (value &amp;&amp; typeof value === &quot;object&quot;) {
        return `${labels[value.unit] || value.unit} · ${priceLabels[value.band] || value.band}`;
      }
      return labels[value] || value;
    };

    const shorten = (text, limit) =&gt; {
      if (!text) return &quot;&quot;;
      if (text.length &lt;= limit) return text;
      const clipped = text.slice(0, limit + 1);
      const boundary = clipped.lastIndexOf(&quot; &quot;);
      return `${clipped.slice(0, boundary &gt; limit * 0.7 ? boundary : limit)}…`;
    };

    const publishers = (sources) =&gt; {
      const unique = [];
      (sources || []).forEach((source) =&gt; {
        const publisher = source.publisher || source.title;
        if (publisher &amp;&amp; !unique.includes(publisher)) unique.push(publisher);
      });
      return unique.slice(0, 2).join(&quot; + &quot;);
    };

    const rationaleFor = (cell, resolution) =&gt; {
      if (resolution.mode === &quot;aligned&quot; || resolution.mode === &quot;estimated&quot;) {
        return shorten(cell.prose || cell.note || &quot;No narrative supplied.&quot;, 240);
      }
      if (resolution.mode === &quot;mixed&quot;) {
        const primary = cell.note || &quot;The sourced report retains the transaction unit.&quot;;
        return shorten(`${primary} The price band is supplemented from the secondary narrative.`, 240);
      }
      if (cell.note) return shorten(cell.note, 240);
      return `The sourced report selects ${displayValue(resolution.selected)}; the secondary narrative proposes a different classification.`;
    };

    const fastCount = rows.filter((row) =&gt;
      [&quot;minutes_hours&quot;, &quot;days&quot;].includes(row.cells.time_to_first_usable_output.research)
    ).length;
    const auditCount = rows.filter((row) =&gt;
      [&quot;source_cited&quot;, &quot;claim_level_traceable&quot;].includes(row.cells.auditable_provenance.research)
    ).length;
    const scaleCount = rows.filter(
      (row) =&gt; row.cells.marginal_cost_of_next_assessment.research === &quot;near_zero&quot;
    ).length;

    root.querySelector(&quot;#clmi-fast-count&quot;).textContent = fastCount;
    root.querySelector(&quot;#clmi-audit-count&quot;).textContent = auditCount;
    root.querySelector(&quot;#clmi-scale-count&quot;).textContent = scaleCount;

    const headRow = root.querySelector(&quot;#clmi-head-row&quot;);
    const body = root.querySelector(&quot;#clmi-body&quot;);
    const counts = { aligned: 0, estimated: 0, mixed: 0, retained: 0 };

    dimensions.forEach(([, label, detail], index) =&gt; {
      const th = document.createElement(&quot;th&quot;);
      th.scope = &quot;col&quot;;

      const dimensionIndex = document.createElement(&quot;span&quot;);
      dimensionIndex.className = &quot;clmi-dimension-index text-small&quot;;
      dimensionIndex.textContent = String(index + 1).padStart(2, &quot;0&quot;);
      th.appendChild(dimensionIndex);

      const dimensionLabel = document.createElement(&quot;span&quot;);
      dimensionLabel.className = &quot;clmi-dimension-label&quot;;
      dimensionLabel.textContent = label;
      th.appendChild(dimensionLabel);

      const dimensionMeta = document.createElement(&quot;span&quot;);
      dimensionMeta.className = &quot;clmi-dimension-meta text-small&quot;;
      dimensionMeta.textContent = detail;
      th.appendChild(dimensionMeta);
      headRow.appendChild(th);
    });

    rows.forEach((row, rowIndex) =&gt; {
      const tr = document.createElement(&quot;tr&quot;);
      const header = document.createElement(&quot;th&quot;);
      header.scope = &quot;row&quot;;
      header.dataset.type = row.type;

      const index = document.createElement(&quot;span&quot;);
      index.className = &quot;clmi-row-index text-small&quot;;
      index.textContent = String(rowIndex + 1).padStart(2, &quot;0&quot;);
      header.appendChild(index);

      const name = document.createElement(&quot;span&quot;);
      name.className = &quot;clmi-name&quot;;
      name.textContent = row.name;
      header.appendChild(name);

      const parent = document.createElement(&quot;span&quot;);
      parent.className = &quot;clmi-parent&quot;;
      parent.textContent = row.parent;
      header.appendChild(parent);

      const meta = document.createElement(&quot;span&quot;);
      meta.className = &quot;clmi-row-meta text-small&quot;;
      meta.textContent = `${labels[row.type] || row.type} · ${labels[row.confidence] || row.confidence}`;
      header.appendChild(meta);
      tr.appendChild(header);

      dimensions.forEach(([key]) =&gt; {
        const cell = row.cells[key];
        const resolution = resolve(cell.research, cell.secondary);
        counts[resolution.mode] += 1;

        const td = document.createElement(&quot;td&quot;);
        td.dataset.mode = resolution.mode;

        const value = document.createElement(&quot;span&quot;);
        value.className = &quot;clmi-value&quot;;
        value.textContent = displayValue(resolution.selected);
        td.appendChild(value);

        const rationale = document.createElement(&quot;p&quot;);
        rationale.className = &quot;clmi-rationale&quot;;
        rationale.textContent = rationaleFor(cell, resolution);
        td.appendChild(rationale);

        if (resolution.mode === &quot;retained&quot; || resolution.mode === &quot;mixed&quot;) {
          const alternate = document.createElement(&quot;p&quot;);
          alternate.className = &quot;clmi-alt text-small&quot;;

          const alternateLabel = document.createElement(&quot;strong&quot;);
          alternateLabel.textContent = `Secondary: ${displayValue(cell.secondary)}. `;
          alternate.appendChild(alternateLabel);
          alternate.appendChild(document.createTextNode(shorten(cell.prose, 140)));
          td.appendChild(alternate);
        }

        const evidence = document.createElement(&quot;span&quot;);
        evidence.className = &quot;clmi-evidence text-small&quot;;
        const sourceCount = (cell.sources || []).length;
        const publisherText = publishers(cell.sources);
        const statusKey = cell.status === &quot;unspecified&quot; ? &quot;unspecified_status&quot; : cell.status;
        evidence.textContent =
          `${modeLabels[resolution.mode]} · ${labels[statusKey] || cell.status}` +
          ` · ${sourceCount} source${sourceCount === 1 ? &quot;&quot; : &quot;s&quot;}` +
          (publisherText ? ` · ${publisherText}` : &quot;&quot;);
        td.appendChild(evidence);
        tr.appendChild(td);
      });

      body.appendChild(tr);
    });

    root.querySelector(&quot;#clmi-aligned&quot;).textContent = `✓ ${counts.aligned} aligned`;
    root.querySelector(&quot;#clmi-estimated&quot;).textContent = `~ ${counts.estimated} estimated gaps`;
    root.querySelector(&quot;#clmi-mixed&quot;).textContent = `± ${counts.mixed} mixed convergence`;
    root.querySelector(&quot;#clmi-retained&quot;).textContent = `≠ ${counts.retained} sourced decisions`;
  })();
&lt;/script&gt;

(() =&gt; {
  if (window.FloatingUIDOM == null) {
